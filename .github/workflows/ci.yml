name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # needed to attach binaries to releases on tags

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  test:
    name: Test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - name: Format
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Tests
        run: cargo test --all

  build:
    name: Build ${{ matrix.name }}
    needs: test
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x64
            os: windows-latest
            target: x86_64-pc-windows-msvc
          - name: windows-arm64
            os: windows-latest
            target: aarch64-pc-windows-msvc
          - name: macos-universal
            os: macos-latest
            target: universal
          - name: linux-x64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target == 'universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.name }}

      - name: Build (macOS universal)
        if: matrix.target == 'universal'
        run: |
          cargo build --release -p magicdrop --target aarch64-apple-darwin
          cargo build --release -p magicdrop --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/magicdrop \
            target/aarch64-apple-darwin/release/magicdrop \
            target/x86_64-apple-darwin/release/magicdrop
          lipo -info dist/magicdrop

      - name: Build
        if: matrix.target != 'universal'
        shell: bash
        run: |
          cargo build --release -p magicdrop --target ${{ matrix.target }}
          mkdir -p dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            cp target/${{ matrix.target }}/release/magicdrop.exe dist/
          else
            cp target/${{ matrix.target }}/release/magicdrop dist/
          fi

      - name: Package
        shell: bash
        run: |
          cp README.md dist/
          cd dist
          if [[ "${{ runner.os }}" == "Windows" ]]; then
            7z a ../magicdrop-${{ matrix.name }}.zip *
          else
            zip -r ../magicdrop-${{ matrix.name }}.zip .
          fi

      - uses: actions/upload-artifact@v4
        with:
          name: magicdrop-${{ matrix.name }}
          path: magicdrop-${{ matrix.name }}.zip

      - name: Attach to release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: magicdrop-${{ matrix.name }}.zip
          generate_release_notes: true
